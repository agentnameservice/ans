<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1246px" height="603px" viewBox="0 0 1246 603"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="19" y="12" width="1200" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(31, 41, 51);"><text x="21" y="40">Inside ARD Discovery</text></g></g></g><g data-cell-id="subtitle"><g><rect x="19" y="46" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(91, 102, 114);"><text x="21" y="66">Lets people and AI agents find a registered agent by what it does, and hands back a proof link with every result.</text></g></g></g><g data-cell-id="ard"><g><rect x="369" y="92" width="500" height="386" rx="8" ry="8" fill="#eff8f8" stroke="#2e8c8c" stroke-width="2" pointer-events="all" style="fill: rgb(239, 248, 248); stroke: rgb(46, 140, 140);"/></g><g><g fill="#17494A" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 73, 74);"><text x="391" y="130">ARD Discovery</text></g></g><g data-cell-id="ard_c"><g><rect x="369" y="111" width="500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="end" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="847" y="129">Agentic Resource Discovery</text></g></g></g><g data-cell-id="ingest"><g transform="translate(0.5,0.5)"><rect x="389" y="148" width="460" height="62" rx="4" ry="4" fill="#ffffff" s