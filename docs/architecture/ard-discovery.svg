egistration Authority</text></g></g><g data-cell-id="ra_b"><g><rect x="19" y="180" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="139" y="199">public events feed</text></g></g></g></g><g data-cell-id="client"><g><rect x="979" y="394" width="240" height="62" rx="6" ry="6" fill="#e2f2e6" stroke="#4e8f5e" stroke-width="1.5" pointer-events="all" style="fill: rgb(226, 242, 230); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(39, 81, 47);"><text x="1099" y="424">Client or AI agent</text></g></g><g data-cell-id="client_b"><g><rect x="979" y="426" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="445">no login</text></g></g></g></g><g data-cell-id="l1"><g><path d="M 389 179 L 268.39 179" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 260.79 179 L 268.39 175.2 L 268.39 182.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="324" y="174">reads</text></g></g></g><g data-cell-id="l2"><g><path d="M 979 425 L 858.39 425" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 850.79 425 L 858.39 421.2 L 858.39 428.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="420">searches</text></g></g></g><g data-cell-id="note0"><g><rect x="369" y="500" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="519">Every result links to the agent’s receipt in the Transparency Log.</text></g></g></g><g data-cell-id="note1"><g><rect x="369" y="522" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="541">A client need not trust the discovery service: it can check the proof itself.</text></g></g></g><g data-cell-id="leg_s"><g><path d="M 19 568 L 49.61 568" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 57.21 568 L 49.61 571.8 L 49.61 564.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_s_t"><g><rect x="67" y="558" width="63" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="69" y="573">request</text></g></g></g><g data-cell-id="leg_c"><g transform="translate(0.5,0.5)"><path d="M 134.4 563 C 134.4 560.79 140.22 559 147.4 559 C 150.85 559 154.15 559.42 156.59 560.17 C 159.03 560.92 160.4 561.94 160.4 563 L 160.4 573 C 160.4 575.21 154.58 577 147.4 577 C 140.22 57