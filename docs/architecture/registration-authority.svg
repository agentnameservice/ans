ill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="667">The owner publishes their own DNS records and challenge files.</text></g></g></g><g data-cell-id="note1"><g><rect x="369" y="670" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="689">The Registration Authority only reads them.</text></g></g></g><g data-cell-id="leg_s"><g><path d="M 19 716 L 49.61 716" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 57.21 716 L 49.61 719.8 L 49.61 712.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_s_t"><g><rect x="67" y="706" width="63" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="69" y="721">request</text></g></g></g><g data-cell-id="leg_d"><g><path d="M 134.4 716 L 165.01 716" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" stroke-dasharray="9.6 6.4" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 172.61 716 L 165.01 719.8 L 165.01 712.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_d_t"><g><rect x="182.4" y="706" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif