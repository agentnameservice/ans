<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1246px" height="751px" viewBox="0 0 1246 751"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="19" y="12" width="1200" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(31, 41, 51);"><text x="21" y="40">Inside the Registration Authority</text></g></g></g><g data-cell-id="subtitle"><g><rect x="19" y="46" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(91, 102, 114);"><text x="21" y="66">Decides whether an agent may carry a name, then reports what it decided to the Transparency Log.</text></g></g></g><g data-cell-id="ra"><g><rect x="369" y="92" width="500" height="534" rx="8" ry="8" fill="#f0f5fc" stroke="#3f6faf" stroke-width="2" pointer-events="all" style="fill: rgb(240, 245, 252); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(31, 63, 110);"><text x="391" y="130">Registration Authority</text></g></g><g data-cell-id="ra_c"><g><rect x="369" y="111" width="500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Menlo, Consolas, monospace" text-anchor="end" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="847" y="129">ans-ra</text></g></g></g><g data-cell-id="api"><g transform="translate(0.5,0.5)"><rect x="389" y="148" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="178">Registration API</text></g></g><g data-cell-id="api_b"><g><rect x="389" y="180" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="200">register, verify, renew and revoke agents</text></g></g></g></g><g data-cell-id="checks"><g transform="translate(0.5,0.5)"><rect x="389" y="222" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="252">Domain-control checks</text></g></g><g data-cell-id="checks_b"><g><rect x="389" y="254" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="274">reads the owner’s DNS records and challenge file</text></g></g></g></g><g data-cell-id="certs"><g transform="translate(0.5,0.5)"><rect x="389" y="296" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="326">Certificate issuance</text></g></g><g data-cell-id="certs_b"><g><rect x="389" y="328" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="348">identity and server certificates for the agent</text></g></g></g></g><g data-cell-id="events"><g transform="translate(0.5,0.5)"><rect x="389" y="370" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="400">Event signing and delivery</text></g></g><g data-cell-id="events_b"><g><rect x="389" y="402" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="422">signs each lifecycle event and sends it to the log</text></g></g></g></g><g data-cell-id="feed"><g transform="translate(0.5,0.5)"><rect x="389" y="444" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="474">Public events feed</text></g></g><g data-cell-id="feed_b"><g><rect x="389" y="476" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="496">events the log has accepted, readable by anyone</text></g></g></g></g><g data-cell-id="db"><g transform="translate(0.5,0.5)"><path d="M 389 527 C 3