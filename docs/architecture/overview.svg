g></g><g data-cell-id="leg_s_t"><g><rect x="70" y="590" width="224" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="72" y="605">request, from caller to callee</text></g></g></g><g data-cell-id="foot"><g><rect x="750" y="590" width="570" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="end" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="1318" y="608">Each component has its own diagram. Start here, then zoom in.</text></g></g></g></g></g></g></svg>
