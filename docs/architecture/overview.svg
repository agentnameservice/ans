<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1346px" height="636px" viewBox="0 0 1346 636"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="22" y="12" width="1288" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(31, 41, 51);"><text x="24" y="40">Agent Name Service: how the pieces fit</text></g></g></g><g data-cell-id="subtitle"><g><rect x="22" y="46" width="1288" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(91, 102, 114);"><text x="24" y="66">Follow the numbers: an agent is registered, sealed in a public log, listed and scored, then found, verified and called.</text></g></g></g><g data-cell-id="z_owner"><g transform="translate(0.5,0.5)"><rect x="12" y="92" width="248" height="432" rx="8" ry="8" fill="#fef7ec" stroke="#c9873a" pointer-events="all" style="fill: rgb(254, 247, 236); stroke: rgb(201, 135, 58);"/></g><g><g fill="#7A4E16" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(122, 78, 22);"><text x="28" y="120">AGENT OWNER</text></g></g></g><g data-cell-id="z_ans"><g transform="translate(0.5,0.5)"><rect x="366" y="92" width="570" height="192" rx="8" ry="8" fill="#f0f5fc" stroke="#3f6faf" pointer-events="all" style="fill: rgb(240, 245, 252); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(31, 63, 110);"><text x="382" y="120">ANS OPERATOR</text></g></g></g><g data-cell-id="z_svc"><g transform="translate(0.5,0.5)"><rect x="366" y="348" width="570" height="176" rx="8" ry="8" fill="#f6f7f8" stroke="#8a939e" pointer-events="all" style="fill: rgb(246, 247, 248); stroke: rgb(138, 147, 158);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(31, 41, 51);"><text x="382" y="376">DISCOVERY AND TRUST SERVICES · NO SPECIAL ACCESS NEEDED</text></g></g></g><g data-cell-id="z_any"><g transform="translate(0.5,0.5)"><rect x="1072" y="92" width="248" height="432" rx="8" ry="8" fill="#f0f8f2" stroke="#4e8f5e" pointer-events="all" style="fill: rgb(240, 248, 242); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(39, 81, 47);"><text x="1088" y="120">ANYONE · NO ACCOUNT NEEDED</text></g></g></g><g data-cell-id="owner"><g><rect x="26" y="148" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#c9873a" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(201, 135, 58);"/></g><g><g fill="#7A4E16" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(122, 78, 22);"><text x="136" y="184">Agent owner</text></g></g><g data-cell-id="owner_b"><g><rect x="26" y="186" width="220" height="74" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="136" y="207">runs an agent and</text><text x="136" y="225">registers it by name</text></g></g></g></g><g data-cell-id="agent"><g><rect x="26" y="388" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#c9873a" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(201, 135, 58);"/></g><g><g fill="#7A4E16" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(122, 78, 22);"><text x="136" y="424">Agent</text></g></g><g data-cell-id="agent_b"><g><rect x="26" y="426" width="220" height="74" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="136" y="447">endpoint and DNS records</text><text x="136" y="465">on the owner’s domain</text></g></g></g></g><g data-cell-id="ra"><g><rect x="390" y="148" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#3f6faf" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(31, 63, 110);"><text x="500" y="184">Registration Authority</text></g></g><g data-cell-id="ra_c"><g><rect x="390" y="186" width="220" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="500" y="204">ans-ra</text></g></g></g><g data-cell-id="ra_b"><g><rect x="390" y="208" width="220" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="500" y="229">checks domain control,</text><text x="500" y="247">issues certificates</text></g></g></g></g><g data-cell-id="tl"><g><rect x="692" y="148" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#3f6faf" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(31, 63, 110);"><text x="802" y="184">Transparency Log</text></g></g><g data-cell-id="tl_c"><g><rect x="692" y="186" width="220" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="802" y="204">ans-tl</text></g></g></g><g data-cell-id="tl_b"><g><rect x="692" y="208" width="220" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="802" y="229">append-only Merkle tree</text><text x="802" y="247">of signed agent events</text></g></g></g></g><g data-cell-id="ard"><g><rect x="390" y="388" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#2e8c8c" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(46, 140, 140);"/></g><g><g fill="#17494A" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(23, 73, 74);"><text x="500" y="424">ARD Discovery</text></g></g><g data-cell-id="ard_c"><g><rect x="390" y="426" width="220" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="500" y="444">Agentic Resource Discovery</text></g></g></g><g data-cell-id="ard_b"><g><rect x="390" y="448" width="220" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="500" y="469">searchable catalog of</text><text x="500" y="487">registered agents</text></g></g></g></g><g data-cell-id="atd"><g><rect x="692" y="388" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#7b5cb8" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(123, 92, 184);"/></g><g><g fill="#43307A" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(67, 48, 122);"><text x="802" y="424">Agent Trust Discovery</text></g></g><g data-cell-id="atd_b"><g><rect x="692" y="426" width="220" height="74" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="802" y="447">agent search, plus scores</text><text x="802" y="465">on five trust dimensions</text></g></g></g></g><g data-cell-id="verify"><g><rect x="1086" y="148" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#4e8f5e" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(39, 81, 47);"><text x="1196" y="184">Verifier</text></g></g><g data-cell-id="verify_c"><g><rect x="1086" y="186" width="220" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="1196" y="204">ans-verify</text></g></g></g><g data-cell-id="verify_b"><g><rect x="1086" y="208" width="220" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="1196" y="229">checks a proof using only</text><text x="1196" y="247">the log’s public key</text></g></g></g></g><g data-cell-id="client"><g><rect x="1086" y="388" width="220" height="112" rx="6" ry="6" fill="#ffffff" stroke="#4e8f5e" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(39, 81, 47);"><text x="1196" y="424">Client or AI agent</text></g></g><g data-cell-id="client_b"><g><rect x="1086" y="426" width="220" height="74" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="1196" y="447">finds an agent, verifies it,</text><text x="1196" y="465">then calls it</text></g></g></g></g><g data-cell-id="e1"><g><path d="M 246 188 L 380.61 188" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 388.21 188 L 380.61 191.8 L 380.61 184.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="318" y="183">① registers</text></g></g></g><g data-cell-id="e2"><g><path d="M 390 232 L 313 232 L 313 421.6 L 255.39 421.6" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 247.79 421.6 L 255.39 417.8 L 255.39 425.4 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(31, 41, 51);"><rect fill="#FFFFFF" stroke="none" x="267" y="306" width="94" height="35" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="313" y="319.5">② checks</text><text x="313" y="336.5">domain control</text></g></g></g