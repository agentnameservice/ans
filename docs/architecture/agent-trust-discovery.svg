<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1246px" height="751px" viewBox="0 0 1246 751"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="19" y="12" width="1200" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(31, 41, 51);"><text x="21" y="40">Inside Agent Trust Discovery</text></g></g></g><g data-cell-id="subtitle"><g><rect x="19" y="46" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(91, 102, 114);"><text x="21" y="66">Finds agents and answers the question the log cannot: how far should each one be trusted? Every score shows its working.</text></g></g></g><g data-cell-id="atd"><g><rect x="369" y="92" width="500" height="534" rx="8" ry="8" fill="#f6f2fc" stroke="#7b5cb8" stroke-width="2" pointer-events="all" style="fill: rgb(246, 242, 252); stroke: rgb(123, 92, 184);"/></g><g><g fill="#43307A" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(67, 48, 122);"><text x="391" y="130">Agent Trust Discovery</text></g></g><g data-cell-id="collect"><g transform="translate(0.5,0.5)"><rect x="389" y="148" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="178">Evidence collectors</text></g></g><g data-cell-id="collect_b"><g><rect x="389" y="180" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="200">compare what the log sealed with the live agent</text></g></g></g></g><g data-cell-id="import"><g transform="translate(0.5,0.5)"><rect x="389" y="222" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="252">Import API</text></g></g><g data-cell-id="import_b"><g><rect x="389" y="254" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="274">the only way in; collectors run as separate processes</text></g></g></g></g><g data-cell-id="store"><g transform="translate(0.5,0.5)"><path d="M 389 305 C 389 300.03 491.97 296 619 296 C 680 296 738.5 296.95 781.63 298.64 C 824.77 300.32 849 302.61 849 305 L 849 373 C 849 377.97 746.03 382 619 382 C 491.97 382 389 377.97 389 373 Z" fill="#f1f2f4" stroke="#7b8591" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(241, 242, 244); stroke: rgb(123, 133, 145);"/><path d="M 849 305 C 849 309.97 746.03 314 619 314 C 491.97 314 389 309.97 389 305" fill="none" stroke="#7b8591" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(123, 133, 145);"/></g><g data-cell-id="store_t"><g><rect x="389" y="318" width="460" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="339">Agent catalog</text></g></g></g><g data-cell-id="store_b"><g><rect x="389" y="340" width="460" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="360">agents and what collectors reported about them</text></g></g></g></g><g data-cell-id="score"><g transform="translate(0.5,0.5)"><rect x="389" y="394" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="424">Scoring engine</text></g></g><g data-cell-id="score_b"><g><rect x="389" y="426" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="446">pluggable signals, weighted by a scoring profile</text></g></g></g></g><g data-cell-id="search"><g transform="translate(0.5,0.5)"><rect x="389" y="468" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="498">Search API</text></g></g><g data-cell-id="search_b"><g><rect x="389" y="500" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="520">find agents by text, protocol, tag or capability</text></g></g></g></g><g data-cell-id="trust"><g transform="translate(0.5,0.5)"><rect x="389" y="542" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="572">Trust API</text></g></g><g data-cell-id="trust_b"><g><rect x="389" y="574" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="594">one agent’s scores, risk factors and the reasons</text></g></g></g></g></g><g data-cell-id="ans"><g><rect x="19" y="148" width="240" height="62" rx="6" ry="6" fill="#e3edfa" stroke="#3f6faf" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 237, 250); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(31, 63, 110);"><text x="139" y="178">ANS public records</text></g></g><g data-cell-id="ans_b"><g><rect x="19" y="180" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="139" y="199">events feed and log</text></g></g></g></g><g data-cell-id="agent"><g><rect x="979" y="148" width="240" height="62" rx="6" ry="6" fill="#fdf1dd" stroke="#c9873a" stroke-width="1.5" pointer-events="all" style="fill: rgb(253, 241, 221); stroke: rgb(201, 135, 58);"/></g><g><g fill="#7A4E16" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(122, 78, 22);"><text x="1099" y="178">Agent</text></g></g><g data-cell-id="agent_b"><g><rect x="979" y="180" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="199">live DNS and TLS</text></g></g></g></g><g data-cell-id="client"><g><rect x="979" y="468" width="240" height="136" rx="6" ry="6" fill="#e2f2e6" stroke="#4e8f5e" stroke-width="1.5" pointer-events="all" style="fill: rgb(226, 242, 230); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(39, 81, 47);"><text x="1099" y="535">Client or AI agent</text></g></g><g data-cell-id="client_b"><g><rect x="979" y="537" width="240" height="67" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="556">no login</text></g></g></g></g><g data-cell-id="l1"><g><path d="M 389 179 L 268.39 179" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 260.79 179 L 268.39 175.2 L 268.39 182.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="324" y="174">reads</text></g></g></g><g data-cell-id="l2"><g><path d="M 849 179 L 969.61 179" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 977.21 179 L 969.61 182.8 L 969.61 175.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="174">probes</text></g></g></g><g data-cell-id="l3"><g><path d="M 979 498.99 L 858.39 499" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 850.79 499 L 858.39 495.2 L 858.39 502.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="494">searches</text></g></g></g><g data-cell-id="l4"><g><path d="M 979 573.01 L 858.39 573" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 850.79 573 L 858.39 569.2 L 858.39 576.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="568">looks up</text></g></g></g><g data-cell-id="note0"><g><rect x="369" y="648" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="667">Five dimensions, each scored 0 to 100: integrity, identity, solvency, behavior, safety.</text></g></g></g><g data-cell-id="note1"><g><rect x="369" y="670" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="689">No black box: every signal reports its score, its weight and an explanation.</text></g></g></g><g data-cell-id="leg_s"><g><path d="M 19 716 L 49.61 716" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 57.21 716 L 49.61 719.8 L 49.61 712.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_s_t"><g><rect x="67" y="706" width="63" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="69" y="721">request</text></g></g></g><g data-cell-id="leg_c"><g transform="translate(0.5,0.5)"><path d="M 134.4 711 C 134.4 708.79 140.22 707 147.4 707 C 150.85 707 154.15 707.42 156.59 708.17 C 159.03 708.92 160.4 709.94 160.4 711 L 160.4 721 C 160.4 723.21 154.58 725 147.4 725 C 140.22 725 134.4 723.21 134.4 721 Z" fill="#f1f2f4" stroke="#7b8591" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(241, 242, 244); stroke: rgb(123, 133, 145);"/><path d="M 160.4 711 C 160.4 713.21 154.58 715 147.4 715 C 140.22 715 134.4 713.21 134.4 711" fill="none" stroke="#7b8591" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(123, 133, 145);"/></g></g><g data-cell-id="leg_c_t"><g><rect x="168.4" y="706" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="170.4" y="721">data store</text></g></g></g></g></g></g></svg>
