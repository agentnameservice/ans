<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1246px" height="653px" viewBox="0 0 1246 653"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="19" y="12" width="1200" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(31, 41, 51);"><text x="21" y="40">Inside the Verifier</text></g></g></g><g data-cell-id="subtitle"><g><rect x="19" y="46" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(91, 102, 114);"><text x="21" y="66">A command-line tool anyone can run. It trusts the log’s public key and nothing else.</text></g></g></g><g data-cell-id="verify"><g><rect x="369" y="92" width="500" height="436" rx="8" ry="8" fill="#f0f8f2" stroke="#4e8f5e" stroke-width="2" pointer-events="all" style="fill: rgb(240, 248, 242); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(39, 81, 47);"><text x="391" y="130">Verifier</text></g></g><g data-cell-id="verify_c"><g><rect x="369" y="111" width="500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Menlo, Consolas, monospace" text-anchor="end" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="847" y="129">ans-verify</text></g></g></g><g data-cell-id="find"><g transform="translate(0.5,0.5)"><rect x="389" y="148" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="178">Find the registration</text></g></g><g data-cell-id="find_b"><g><rect x="389" y="180" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="200">optional: look the agent up by its domain name</text></g></g></g></g><g data-cell-id="fetch"><g transform="translate(0.5,0.5)"><rect x="389" y="222" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="252">Fetch the evidence</text></g></g><g data-cell-id="fetch_b"><g><rect x="389" y="254" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="274">the log’s public key and the agent’s receipt</text></g></g></g></g><g data-cell-id="proof"><g transform="translate(0.5,0.5)"><rect x="389" y="296" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="326">Check the proof</text></g></g><g data-cell-id="proof_b"><g><rect x="389" y="328" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="348">the event is in the Merkle tree the log signed</text></g></g></g></g><g data-cell-id="sig"><g transform="translate(0.5,0.5)"><rect x="389" y="370" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="400">Check the signature</text></g></g><g data-cell-id="sig_b"><g><rect x="389" y="402" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="422">the receipt was signed with the log’s key</text></g></g></g></g><g data-cell-id="cross"><g transform="translate(0.5,0.5)"><rect x="389" y="444" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="474">Cross-check</text></g></g><g data-cell-id="cross_b"><g><rect x="389" y="476" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="496">badge, status and published metadata agree</text></g></g></g></g></g><g data-cell-id="runner"><g><rect x="19" y="148" width="240" height="62" rx="6" ry="6" fill="#e2f2e6" stroke="#4e8f5e" stroke-width="1.5" pointer-events="all" style="fill: rgb(226, 242, 230); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(39, 81, 47);"><text x="139" y="178">Anyone</text></g></g><g data-cell-id="runner_b"><g><rect x="19" y="180" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="139" y="199">a person, a CI job, a client</text></g></g></g></g><g data-cell-id="dns"><g><rect x="979" y="148" width="240" height="62" rx="6" ry="6" fill="#fdf1dd" stroke="#c9873a" stroke-width="1.5" pointer-events="all" style="fill: rgb(253, 241, 221); stroke: rgb(201, 135, 58);"/></g><g><g fill="#7A4E16" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(122, 78, 22);"><text x="1099" y="178">Agent’s DNS</text></g></g><g data-cell-id="dns_b"><g><rect x="979" y="180" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="199">badge record</text></g></g></g></g><g data-cell-id="tl"><g><rect x="979" y="222" width="240" height="62" rx="6" ry="6" fill="#e3edfa" stroke="#3f6faf" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 237, 250); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(31, 63, 110);"><text x="1099" y="252">Transparency Log</text></g></g><g data-cell-id="tl_b"><g><rect x="979" y="254" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="273">public read API</text></g></g></g></g><g data-cell-id="agent"><g><rect x="979" y="444" width="240" height="62" rx="6" ry="6" fill="#fdf1dd" stroke="#c9873a" stroke-width="1.5" pointer-events="all" style="fill: rgb(253, 241, 221); stroke: rgb(201, 135, 58);"/></g><g><g fill="#7A4E16" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(122, 78, 22);"><text x="1099" y="474">Agent metadata</text></g></g><g data-cell-id="agent_b"><g><rect x="979" y="476" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="495">published by the owner</text></g></g></g></g><g data-cell-id="l1"><g><path d="M 259 179 L 379.61 179" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 387.21 179 L 379.61 182.8 L 379.61 175.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="324" y="174">runs</text></g></g></g><g data-cell-id="l2"><g><path d="M 849 179 L 969.61 179" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" stroke-dasharray="9.6 6.4" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 977.21 179 L 969.61 182.8 L 969.61 175.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="174">looks up</text></g></g></g><g data-cell-id="l3"><g><path d="M 849 253 L 969.61 253" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 977.21 253 L 969.61 256.8 L 969.61 249.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="248">reads</text></g></g></g><g data-cell-id="l4"><g><path d="M 849 475 L 969.61 475" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 977.21 475 L 969.61 478.8 L 969.61 471.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="470">fetches</text></g></g></g><g data-cell-id="note0"><g><rect x="369" y="550" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="569">Result: VERIFIED, or a failing exit code a script can act on.</text></g></g></g><g data-cell-id="note1"><g><rect x="369" y="572" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="591">Works offline too, from a saved receipt and a pinned key.</text></g></g></g><g data-cell-id="leg_s"><g><path d="M 19 618 L 49.61 618" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 57.21 618 L 49.61 621.8 L 49.61 614.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_s_t"><g><rect x="67" y="608" width="63" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="69" y="623">request</text></g></g></g><g data-cell-id="leg_d"><g><path d="M 134.4 618 L 165.01 618" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" stroke-dasharray="9.6 6.4" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 172.61 618 L 165.01 621.8 L 165.01 614.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_d_t"><g><rect x="182.4" y="608" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="184.4" y="623">optional</text></g></g></g></g></g></g></svg>
