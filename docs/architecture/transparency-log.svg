read API</text></g></g><g data-cell-id="read_b"><g><rect x="389" y="500" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="520">receipts, badges, history, checkpoints, public key</text></g></g></g></g><g data-cell-id="index"><g transform="translate(0.5,0.5)"><path d="M 389 551 C 389 546.03 491.97 542 619 542 C 680 542 738.5 542.95 781.63 544.64 C 824.77 546.32 849 548.61 849 551 L 849 619 C 849 623.97 746.03 628 619 628 C 491.97 628 389 623.97 389 619 Z" fill="#f1f2f4" stroke="#7b8591" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(241, 242, 244); stroke: rgb(123, 133, 145);"/><path d="M 849 551 C 849 555.97 746.03 560 619 560 C 491.97 560 389 555.97 389 551" fill="none" stroke="#7b8591" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(123, 133, 145);"/></g><g data-cell-id="index_t"><g><rect x="389" y="564" width="460" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="585">Event index</text></g></g></g><g data-cell-id="index_b"><g><rect x="389" y="586" width="460" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="606">finds an agent’s events without scanning the tree</text></g></g></g></g></g><g data-cell-id="ra"><g><rect x="19" y="148" width="240" height="62" rx="6" ry="6" fill="#e3edfa" stroke="#3f6faf" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 237, 250); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(31, 63, 110);"><text x="139" y="178">Registration Authority</text></g></g><g data-cell-id="ra_b"><g><rect x="19" y="180" width="240" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="139" y="199">trusted sender</text></g></g></g></g><g data-cell-id="readers"><g><rect x="979" y="460" width="240" height="78" rx="6" ry="6" fill="#e2f2e6" stroke="#4e8f5e" stroke-width="1.5" pointer-events="all" style="fill: rgb(226, 242, 230); stroke: rgb(78, 143, 94);"/></g><g><g fill="#27512F" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(39, 81, 47);"><text x="1099" y="490">Anyone, no login</text></g></g><g data-cell-id="readers_b"><g><rect x="979" y="492" width="240" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="1099" y="511">verifiers, clients,</text><text x="1099" y="527">Agent Trust Discovery</text></g></g></g></g><g data-cell-id="l1"><g><path d="M 259 179 L 379.61 179" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 387.21 179 L 379.61 182.8 L 379.61 175.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="324" y="174">signed events</text></g></g></g><g data-cell-id="l2"><g><path d="M 979 499 L 858.39 499" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 850.79 499 L 858.39 495.2 L 858.39 502.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="914" y="494">reads</text></g></g></g><g data-cell-id="note0"><g><rect x="369" y="672" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="691">One signing key covers everything the log publishes,</text></g></g></g><g data-cell-id="note1"><g><rect x="369" y="694" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="371" y="713">so a verifier needs exactly one public key.</text></g></g></g><g data-cell-id="leg_s"><g><path d="M 19 740 L 49.61 740" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 57.21 740 L 49.61 743.8 L 49.61 736.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_s_t"><g><rect x="67" y="730" width="63" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="69" y="745">request</text></g></g></g><g data-cell-id="leg_c"><g transform="translate(0.5,0.5)"><path d="M 134.4 735 C 134.4 732.79 140.22 731 147.4 731 C 150.85 731 154.15 731.42 156.