<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1246px" height="775px" viewBox="0 0 1246 775"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="19" y="12" width="1200" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(31, 41, 51);"><text x="21" y="40">Inside the Transparency Log</text></g></g></g><g data-cell-id="subtitle"><g><rect x="19" y="46" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(91, 102, 114);"><text x="21" y="66">Makes registration decisions public and tamper-evident, so nobody has to take the operator’s word for it.</text></g></g></g><g data-cell-id="tl"><g><rect x="369" y="92" width="500" height="558" rx="8" ry="8" fill="#f0f5fc" stroke="#3f6faf" stroke-width="2" pointer-events="all" style="fill: rgb(240, 245, 252); stroke: rgb(63, 111, 175);"/></g><g><g fill="#1F3F6E" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(31, 63, 110);"><text x="391" y="130">Transparency Log</text></g></g><g data-cell-id="tl_c"><g><rect x="369" y="111" width="500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Menlo, Consolas, monospace" text-anchor="end" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="847" y="129">ans-tl</text></g></g></g><g data-cell-id="intake"><g transform="translate(0.5,0.5)"><rect x="389" y="148" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="178">Event intake</text></g></g><g data-cell-id="intake_b"><g><rect x="389" y="180" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="200">checks each sender’s signature against registered keys</text></g></g></g></g><g data-cell-id="seal"><g transform="translate(0.5,0.5)"><rect x="389" y="222" width="460" height="62" rx="4" ry="4" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(154, 167, 184);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 41, 51);"><text x="405" y="252">Sealing</text></g></g><g data-cell-id="seal_b"><g><rect x="389" y="254" width="460" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="405" y="274">countersigns each event and appends it as a leaf</text></g></g></g></g><g data-cell-id="tree"><g transform="translate(0.5,0.5)"><path d="M 389 305 C 389 300.03 491.97 296 619 296 C 680 296 738.5 296.95 781.63 298.64 C 824.77 300.32 849 302.61 849 305 L 849 373 C 849 377.97 746.03 382 619 382 C 491.97 382 389 377.97 389 373 Z" fill="#f1f2f4" stroke="#7b8591" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(241, 242, 244); stroke: rgb(123, 133, 145);"/><path d="M 849 305 C 849 309.97 746.03 314 619 314 C 491.97 314 389 309.97 389 305" fill="none" stroke="#7b8591" stroke-wi