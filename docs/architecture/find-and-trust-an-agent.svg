27" y="331">① search for an agent</text></g></g></g><g data-cell-id="m7"><g><path d="M 669 382 L 222.39 382" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" stroke-dasharray="9.6 6.4" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 214.79 382 L 222.39 378.2 L 222.39 385.8 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="555" y="377">② matches</text></g></g></g><g data-cell-id="ph8"><g transform="translate(0.5,0.5)"><path d="M 19 416 L 1239 416" fill="none" stroke="#e3e7ed" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(227, 231, 237);"/></g></g><g data-cell-id="ph8_t"><g><rect x="19" y="420" width="100" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="11px" style="fill: rgb(91, 102, 114);"><text x="21" y="437">ASSESS</text></g></g></g><g data-cell-id="m9"><g><path d="M 213 458 L 659.61 458" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 667.21 458 L 659.61 461.8 L 659.61 454.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="327" y="453">③ look up the agent</text></g></g></g><g data-cell-id="m10"><g><path d="M 669 504 L 222.39 504" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" stroke-dasharray="9.6 6.4" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d