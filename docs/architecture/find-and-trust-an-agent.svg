Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="783" y="621">⑥ signed event + inclusion proof</text></g></g></g><g data-cell-id="n14"><g transform="translate(0.5,0.5)"><rect x="78" y="654" width="270" height="34" rx="4" ry="4" fill="#fffbea" stroke="#d9c58a" pointer-events="all" style="fill: rgb(255, 251, 234); stroke: rgb(217, 197, 138);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13px" style="fill: rgb(31, 41, 51);"><text x="213" y="676.5">runs the Verifier’s checks → VERIFIED</text></g></g></g><g data-cell-id="ph15"><g transform="translate(0.5,0.5)"><path d="M 19 710 L 1239 710" fill="none" stroke="#e3e7ed" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(227, 231, 237);"/></g></g><g data-cell-id="ph15_t"><g><rect x="19" y="714" width="100" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="11px" style="fill: rgb(91, 102, 114);"><text x="21" y="731">CALL</text></g></g></g><g data-cell-id="m16"><g><path d="M 213 752 L 1115.61 752" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 1123.21 752 L 1115.61 755.8 L 1115.61 748.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g><g><g fill="#1F2933" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(31, 41, 51);"><text x="327" y="747">⑦ call the agent directly</text></g></g></g><g data-cell-id="note0"><g><rect x="19" y="804" width="1220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="21" y="823">Both services keep themselves current in the background by reading ANS public records.</text></g></g></g><g data-cell-id="note1"><g><rect x="19" y="826" width="1220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="start" font-size="13px" style="fill: rgb(91, 102, 114);"><text x="21" y="845">Neither is in the call path, and a client can skip either one and still verify the proof.</text></g></g></g><g data-cell-id="leg_s"><g><path d="M 19 870 L 49.61 870" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 57.21 870 L 49.61 873.8 L 49.61 866.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_s_t"><g><rect x="67" y="860" width="42" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="69" y="875">call</text></g></g></g><g data-cell-id="leg_d"><g><path d="M 115.8 870 L 146.41 870" fill="none" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" stroke-dasharray="9.6 6.4" pointer-events="stroke" style="stroke: rgb(43, 52, 64);"/><path d="M 154.01 870 L 146.41 873.8 L 146.41 866.2 Z" fill="#2b3440" stroke="#2b3440" stroke-width="1.6" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 52, 64); stroke: rgb(43, 52, 64);"/></g></g><g data-cell-id="leg_d_t"><g><rect x="163.8" y="860" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5B6672" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-size="12px" style="fill: rgb(91, 102, 114);"><text x="165.8" y="875">response</text